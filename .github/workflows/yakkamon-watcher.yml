name: Yakkamon mismatch watcher

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Scan active OpenSea Bad Egg listings against live Ronin metadata
        id: scan
        continue-on-error: true
        run: |
          python automation/yakkamon-watcher/watcher.py
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"
      - name: Commit changed results
        if: steps.scan.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/yakkamon-watcher/mismatches.json
          git commit -m "Update Yakkamon mismatch results"
          git push
